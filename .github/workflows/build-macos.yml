name: Build macOS artifact

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: GazeGlider-arm64-unsigned
          path: release/*
          if-no-files-found: error
          retention-days: 14
